# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  tesp-installation:
    name: tesp-installation-${VER:-24.04.1}
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: tesp-network
    driver: bridge
