# =============================================================================
# TESP Docker Compose - Multi-Stage Build System
# =============================================================================
# Build stages:
#   1. ubuntu.Dockerfile    -> cosim-ubuntu
#   2. library.Dockerfile   -> cosim-library  
#   3. build_staged.Dockerfile -> cosim-build (multi-stage staged build with parallel compilation)
#
# Usage:
#   Build all:           docker compose build
#   Build specific:      docker compose build cosim-build
#   Build without NS3:   BUILD_NS3=no docker compose build cosim-build
#   Debug specific stage: BUILD_TARGET=build-gridlabd docker compose build cosim-build
#   Run:                 docker compose run --rm cosim-build
#   Clean:               docker compose down --rmi all -v
#
# Environment variables (set in .env or shell):
#   VER              - Version tag (default: 24.04.1)
#   SIM_USER         - Container user (default: worker)
#   SIM_GRP          - Container group (default: runner)
#   BUILD_GRIDLABD   - Build GridLAB-D (default: yes)
#   BUILD_ENERGYPLUS - Build EnergyPlus (default: yes)
#   BUILD_NS3        - Build NS-3 (default: yes)
#   BUILD_IPOPT      - Build Ipopt (default: yes)
#   BUILD_FNCS       - Build FNCS (default: yes)
#   BUILD_HELICS     - Build HELICS (default: yes)
#   BUILD_KLU        - Build KLU solver (default: yes)
#   BUILD_PSST       - Build PSST (default: yes)
#   BUILD_HELICS_PY  - Build HELICS Python (default: yes)
#   BUILD_TESP       - Build TESP agents (default: yes)
#   BUILD_TARGET     - Target stage for debugging (default: cosim-build)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # STAGE 1: ubuntu - Base Ubuntu with runtime dependencies
  # ---------------------------------------------------------------------------
  cosim-ubuntu:
    build:
      context: ./
      dockerfile: ubuntu.Dockerfile
      args:
        - UBUNTU=ubuntu
        - UBUNTU_VERSION=${UBUNTU_VERSION:-24.04}
    image: cosim-ubuntu:tesp_${VER:-24.04.1}
    container_name: cosim-ubuntu
    profiles:
      - ubuntu
      - library
      - build
      - all

  # ---------------------------------------------------------------------------
  # STAGE 2: library - Add build tools and create user
  # ---------------------------------------------------------------------------
  cosim-library:
    build:
      context: ./
      dockerfile: library.Dockerfile
      args:
        - DOCKER_VER=${VER:-24.04.1}
        - TAG=${VER:-24.04.1}
        - SIM_GID=${SIM_GID:-9002}
        - SIM_GRP=${SIM_GRP:-runner}
        - SIM_UID=${SIM_UID:-1001}
        - SIM_USER=${SIM_USER:-worker}
    image: cosim-library:tesp_${VER:-24.04.1}
    container_name: cosim-library
    depends_on:
      - cosim-ubuntu
    profiles:
      - library
      - build
      - all

  # ---------------------------------------------------------------------------
  # STAGE 3: build - Multi-stage build with parallel compilation
  # ---------------------------------------------------------------------------
  cosim-build:
    build:
      context: ${BUILD_DIR:-../build}
      dockerfile: ../docker/build_staged.Dockerfile
      # Target specific stage for debugging (default: final stage)
      # target: ${BUILD_TARGET:-cosim-build}
      args:
        # Version and user configuration
        - DOCKER_VER=${VER:-24.04.1}
        - TAG=${VER:-24.04.1}
        - SIM_USER=${SIM_USER:-worker}
        - SIM_GRP=${SIM_GRP:-runner}
        # Component build flags - set to 'no' to skip
        - BUILD_GRIDLABD=${BUILD_GRIDLABD:-yes}
        - BUILD_ENERGYPLUS=${BUILD_ENERGYPLUS:-yes}
        - BUILD_NS3=${BUILD_NS3:-yes}
        - BUILD_IPOPT=${BUILD_IPOPT:-yes}
        - BUILD_FNCS=${BUILD_FNCS:-yes}
        - BUILD_HELICS=${BUILD_HELICS:-yes}
        - BUILD_KLU=${BUILD_KLU:-yes}
        - BUILD_PSST=${BUILD_PSST:-yes}
        - BUILD_HELICS_PY=${BUILD_HELICS_PY:-yes}
        - BUILD_TESP=${BUILD_TESP:-yes}
      network: host
    image: cosim-build:tesp_${VER:-24.04.1}
    container_name: cosim-build
    depends_on:
      - cosim-library
    profiles:
      - build
      - all
    environment:
      # Runtime environment variables
      - PSST_SOLVER=${PSST_SOLVER:-cbc}
      - PSST_WARNING=${PSST_WARNING:-ignore}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    volumes:
      # Mount examples and outputs for simulations
      - ${HOST_EXAMPLES_DIR:-../examples}:/home/${SIM_USER:-worker}/examples:rw
      - ${HOST_DATA_DIR:-../data}:/home/${SIM_USER:-worker}/data:rw
      - ${HOST_OUTPUT_DIR:-../outputs}:/home/${SIM_USER:-worker}/outputs:rw
      # Optional: Persistent installation volume
      - tesp-installation:/home/${SIM_USER:-worker}/tenv
    working_dir: /home/${SIM_USER:-worker}
    stdin_open: true
    tty: true
    command: /bin/bash

  # ---------------------------------------------------------------------------
  # Debug service - Build only up to a specific stage
  # ---------------------------------------------------------------------------
  cosim-debug:
    build:
      context: ${BUILD_DIR:-../build}
      dockerfile: ../docker/build_staged.Dockerfile
      target: ${BUILD_TARGET:-build-complete}
      args:
        - DOCKER_VER=${VER:-24.04.1}
        - TAG=${VER:-24.04.1}
        - SIM_USER=${SIM_USER:-worker}
        - SIM_GRP=${SIM_GRP:-runner}
        - BUILD_GRIDLABD=${BUILD_GRIDLABD:-yes}
        - BUILD_ENERGYPLUS=${BUILD_ENERGYPLUS:-yes}
        - BUILD_NS3=${BUILD_NS3:-yes}
        - BUILD_IPOPT=${BUILD_IPOPT:-yes}
        - BUILD_FNCS=${BUILD_FNCS:-yes}
        - BUILD_HELICS=${BUILD_HELICS:-yes}
        - BUILD_KLU=${BUILD_KLU:-yes}
        - BUILD_PSST=${BUILD_PSST:-yes}
        - BUILD_HELICS_PY=${BUILD_HELICS_PY:-yes}
        - BUILD_TESP=${BUILD_TESP:-yes}
      network: host
    image: cosim-debug:tesp_${VER:-24.04.1}
    container_name: cosim-debug
    depends_on:
      - cosim-library
    profiles:
      - debug
    working_dir: /home/${SIM_USER:-worker}
    stdin_open: true
    tty: true
    command: /bin/bash

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  tesp-installation:
    name: tesp-installation-${VER:-24.04.1}
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: tesp-network
    driver: bridge