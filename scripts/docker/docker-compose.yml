# =============================================================================
# TESP Docker Compose - Original Multi-Dockerfile Build System (moved)
# =============================================================================
# Replicates the build-images.sh workflow with 5 separate Dockerfiles:
#   1. ubuntu.Dockerfile    -> cosim-ubuntu
#   2. library.Dockerfile   -> cosim-library
#   3. build.Dockerfile     -> cosim-build
#   4. cplex.Dockerfile     -> cosim-cplex
#   5. user.Dockerfile      -> cosim-user
#
# Usage:
#   Build all:        docker-compose -f scripts/docker/docker-compose.yml build
#   Build specific:   docker-compose -f scripts/docker/docker-compose.yml build cosim-build
#   Run:              docker-compose -f scripts/docker/docker-compose.yml run --rm cosim-build
#   Clean:            docker-compose -f scripts/docker/docker-compose.yml down --rmi all -v
# =============================================================================


# =============================================================================
# Service Definitions (matching original build-images.sh)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # STAGE 1: ubuntu - Base Ubuntu with runtime dependencies
  # ---------------------------------------------------------------------------
  cosim-ubuntu:
    build:
      context: ./
      dockerfile: ubuntu.Dockerfile
      args:
        - UBUNTU=ubuntu
        - UBUNTU_VERSION=${VER:-24.04.1}
    image: cosim-ubuntu:tesp_${VER:-24.04.1}
    container_name: cosim-ubuntu
    profiles:
      - ubuntu
      - library
      - build
      - all

  # ---------------------------------------------------------------------------
  # STAGE 2: library - Add build tools and create user
  # ---------------------------------------------------------------------------
  cosim-library:
    build:
      context: ./
      dockerfile: library.Dockerfile
      args:
        - DOCKER_VER=${VER:-24.04.1}
        - TAG=${VER:-24.04.1}
        - SIM_GID=${SIM_GID:-9002}
        - SIM_GRP=${SIM_GRP:-runner}
        - SIM_UID=${SIM_UID:-1001}
        - SIM_USER=${SIM_USER:-worker}
    image: cosim-library:tesp_${VER:-24.04.1}
    container_name: cosim-library
    depends_on:
      - cosim-ubuntu
    profiles:
      - library
      - build
      - all

  # ---------------------------------------------------------------------------
  # STAGE 3: build - Clone, compile, and install all simulation tools
  # ---------------------------------------------------------------------------
  cosim-build:
    build:
      context: ${BUILD_DIR:-../build}
      dockerfile: ../docker/build.Dockerfile
      args:
        - DOCKER_VER=${VER:-24.04.1}
        - TAG=${VER:-24.04.1}
        - SIM_USER=${SIM_USER:-worker}
      network: host
    image: cosim-build:tesp_${VER:-24.04.1}
    container_name: cosim-build
    depends_on:
      - cosim-library
    profiles:
      - build
      - all
    environment:
      # Runtime environment variables
      - PSST_SOLVER=${PSST_SOLVER:-cbc}
      - PSST_WARNING=${PSST_WARNING:-ignore}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    volumes:
      # Mount examples and outputs for simulations
      - ${HOST_EXAMPLES_DIR:-../examples}:/home/${SIM_USER:-worker}/examples:rw
      - ${HOST_DATA_DIR:-../data}:/home/${SIM_USER:-worker}/data:rw
      - ${HOST_OUTPUT_DIR:-../outputs}:/home/${SIM_USER:-worker}/outputs:rw
      # Optional: Persistent installation volume
      - tesp-installation:/home/${SIM_USER:-worker}/tenv
    working_dir: /home/${SIM_USER:-worker}
    stdin_open: true
    tty: true
    command: /bin/bash

